pcap: true

bag: true

bag_dir: ./recordings/bag

pcap_dir: ./recordings/pcap

bag_args: --qos-profile-overrides-path ./qos_profiles.yaml

                        # xsens             # lidar                 # perception # fast_limo    # ekf                           # local_planner                                                                                                                                         
topics: /tf /tf_static /imu/data /odometry /lidar_imu /lidar_points /clusters /fast_limo/state /Odometry /slam/cones_positions /planning/center_line /planning/visualization_triangulation /planning/center_line_completed /planning/race_status /planning/brake_line /planning/end_line

pcap_args: -i eth0 -s 0 udp and port 2368

pcap_name: tcpdump.pcap   # tcpdump_TIMESTAMP.pcap

bag_name: rosbag    # rosbag_TIMESTAMP

date_format: "%Y_%m_%d-%H_%M_%S"

enable_ids: true
